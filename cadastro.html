<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="styles.css" rel="stylesheet">
    <script src="./js/controller.js" defer></script>
</head>
<body>
    <nav>
        <a href="cadastro.html">Cadastro</a>
        <a href="login.html">Login</a>
    </nav>
    <main>
        <form>
            <h1>Realizar Cadastro</h1>
            <label>E-mail</label>
            <input type="email" required id="emailUsuarioCadastro" placeholder="Digite seu nome">
            <label>Senha</label>
            <input type="password" required id="senhaUsuarioCadastro" placeholder="Digite sua senha">
            <label>Reinsira a senha</label>
            <input type="password" required id="senhaUsuarioRedigitadaCadastro" placeholder="Digite sua senha novamente">
            <button type="button" onclick="cadastrarUsuário()">Enviar</button>
        </form>
    </main>
</body>
</html>
